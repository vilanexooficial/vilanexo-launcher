name: Modpack CurseForge
# Copia os arquivos do modpack (hospedados no site) para a branch cfpack, para enviar ao CurseForge.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar do site e publicar na branch cfpack
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 VilaNexoRelease"
          curl -fSL -A "$UA" -o VilaNexo-Cobblemon-1.0.0.zip "https://www.vilanexo.com/cfpack/VilaNexo-Cobblemon-1.0.0.zip"
          curl -fSL -A "$UA" -o vilanexo-logo.png "https://www.vilanexo.com/cfpack/vilanexo-logo.png"
          sha256sum *
          git init -b cfpack
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Arquivos do modpack para o CurseForge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cfpack
